name: Verify and build Blueprint
on:
  push:
  pull_request:
  workflow_call:
  workflow_dispatch:
    inputs:
      full_clean:
        description: Rebuild all Lean dependencies with the original acceptance gate
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Read the fixed canonical source
        id: canonical
        run: |
          python3 - <<'PYLOCK'
          from pathlib import Path
          import json, os, re
          lock = json.loads(Path('upstream.lock.json').read_text())
          url = lock.get('repository') or ''
          match = re.fullmatch(r'https://github.com/([A-Za-z0-9-]+/fractional-triangle-lean)', url)
          if not match or not re.fullmatch(r'[0-9a-f]{40}', lock['commit']):
              raise SystemExit('Configure upstream.lock.json with the published canonical URL and exact commit.')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('repository=' + match[1] + '\nref=' + lock['commit'] + '\n')
          PYLOCK
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ steps.canonical.outputs.repository }}
          ref: ${{ steps.canonical.outputs.ref }}
          path: _upstream
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596 # v1
        with:
          lake-package-directory: _upstream/formal
          build: 'true'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'true'
      - name: Verify formal declarations and source provenance
        run: python3 scripts/check_blueprint.py --source _upstream --lean
      - name: Install Blueprint tools
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz libgraphviz-dev texlive-luatex texlive-latex-extra texlive-lang-japanese latexmk
          python3 -m pip install -r blueprint/requirements.txt
      - name: Build and check HTML and PDF
        run: |
          cd _upstream/formal && lake build canonical_roots && cd ../..
          python3 _upstream/scripts/blueprint_tables.py --check --output-root .
          python3 scripts/build_blueprint.py --source _upstream --pdf
          python3 scripts/check_site.py
      - name: Upload reviewable site
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site
      - name: Upload verification logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verification-logs
          path: validation/
  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Blueprint site
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
